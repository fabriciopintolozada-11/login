name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm test

  # Si algún test falla, Claude Code corrige el código y abre un PR con el arreglo
  autofix:
    needs: test
    if: >-
      failure() &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - name: Guardar salida de los tests fallidos
        run: npm test > test-output.txt 2>&1 || true

      - name: Corregir con Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Los tests del proyecto fallan. La salida de `npm test` está en test-output.txt.
            Encuentra la causa y corrige el código fuente (server/, public/) para que
            todos los tests pasen. No modifiques ni elimines tests para que pasen, salvo
            que el test sea claramente incorrecto; en ese caso explica por qué.
            Ejecuta `npm test` para verificar el arreglo antes de terminar.
          claude_args: >-
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(npm test),Bash(npm ci)"

      - name: Verificar que los tests pasan tras el arreglo
        run: |
          rm -f test-output.txt
          npm test

      - name: Abrir PR con el arreglo
        uses: peter-evans/create-pull-request@v7
        with:
          branch: autofix/tests-${{ github.run_id }}
          commit-message: "fix: corregir tests fallidos (autofix)"
          title: "Autofix: corregir tests fallidos"
          body: |
            Los tests fallaron en ${{ github.sha }}. Claude Code corrigió el código y los tests pasan.
            Revisa los cambios antes de hacer merge.

            🤖 Generated with [Claude Code](https://claude.com/claude-code)
